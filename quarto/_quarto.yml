project:
  title: "forestsearch GLM Calibration"
  # output-dir: _output

# ── Shared format (inherited by all .qmd files) ────────────────
# Document-specific overrides (title, subtitle, fig dimensions,
# execute settings) go in each .qmd's YAML header.
format:
  html:
    toc: true
    toc-depth: 4
    toc-location: left
    number-sections: true
    embed-resources: true
    theme:
      light: cosmo
    html-math-method: mathjax
    smooth-scroll: true
    title-block-banner: "#2C3E50"
    title-block-banner-color: white
    mainfont: "Palatino, Georgia, serif"
    monofont: "Fira Code, JetBrains Mono, Consolas, monospace"
    fontsize: "1.05em"
    linestretch: 1.45
    link-external-newwindow: true
    code-fold: true
    code-tools: true
    anchor-sections: true
    fig-responsive: true
    fig-width: 9
    fig-height: 6
