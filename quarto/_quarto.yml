# quarto/_quarto.yml
#
# Minimal Quarto project config for forestsearch extended documentation.
# Place this file in the quarto/ subdirectory alongside the .qmd files.
#
# Render all documents (from repo root):
#   quarto render quarto/
#
# Render a single document:
#   quarto render quarto/calibration_survival_fourway.qmd
#   quarto render quarto/selection_binary_frontier.qmd
#
# Each .qmd has embed-resources: true in its own front matter, so every
# output .html is fully self-contained --- no external assets required.
# Share by email, open directly in a browser, or host on any static server.
#
# Directory layout:
#   quarto/
#   +-- _output/   HTML renders (managed by Quarto, disposable)
#   +-- _data/     .rds calibration & simulation bundles (persistent, precious)
#
# The _data/ directory stores computationally expensive results:
#   - calibration_binary_leff.rds      (C1, hours of H0 sims)
#   - calibration_survival_leff.rds    (C2/C3, hours of H0 sims)
#   - calibration_survival_fourway_*.rds  (C2, all sim results)
#
# These .rds files are loaded by selection and validation documents
# via load_leff_calibration() from R/leff_calibration_io.R.

project:
  type: default       # NOT "website" --- each file renders independently
  output-dir: _output # quarto/_output/*.html (Quarto-managed)
